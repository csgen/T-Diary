name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR cancels the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests · python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor: tomllib entered the stdlib there, and the project
        # depends on it for config parsing.
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show interpreter
        run: python -VV

      # No install step: the project is standard library only. If a dependency
      # is ever added, this is where it goes -- and that is a decision worth
      # noticing in review rather than slipping in.
      - name: Verify no third-party imports crept in
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          stdlib = sys.stdlib_module_names
          bad = []
          for path in pathlib.Path("src").rglob("*.py"):
              tree = ast.parse(path.read_text(encoding="utf-8"))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      names = [a.name.split(".")[0] for a in node.names]
                  elif isinstance(node, ast.ImportFrom):
                      names = [] if node.level else [(node.module or "").split(".")[0]]
                  else:
                      continue
                  for name in names:
                      if name and name not in stdlib:
                          bad.append(f"{path}:{node.lineno} imports {name!r}")
          if bad:
              print("::error::third-party import found; the project is stdlib-only")
              print("\n".join(bad))
              raise SystemExit(1)
          print("stdlib-only: OK")
          PY

      - name: Run tests
        # Runs without a .env on purpose: CI is the fresh-clone case, and no
        # test may depend on a developer's local configuration.
        run: python -m unittest discover -s tests -v

  guard:
    name: no personal data committed
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: .env must never be committed
        run: |
          if git ls-files --error-unmatch .env > /dev/null 2>&1; then
            echo "::error file=.env::.env is tracked by git; it must stay gitignored"
            exit 1
          fi
          echo ".env is not tracked: OK"

      - name: No real email addresses in tracked files
        run: |
          python - <<'PY'
          import re, subprocess
          # example.com / example.org are reserved for documentation (RFC 2606).
          EMAIL = re.compile(r"[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}")
          ALLOWED = ("example.com", "example.org", "example.net")
          files = subprocess.run(
              ["git", "ls-files"], capture_output=True, text=True, check=True
          ).stdout.split()
          hits = []
          for path in files:
              try:
                  text = open(path, encoding="utf-8", errors="replace").read()
              except OSError:
                  continue
              for line_no, line in enumerate(text.splitlines(), 1):
                  for match in EMAIL.findall(line):
                      if not match.lower().endswith(ALLOWED):
                          hits.append(f"{path}:{line_no}: {match}")
          if hits:
              print("::error::real email address in a tracked file")
              print("\n".join(hits))
              raise SystemExit(1)
          print("no real emails in tracked files: OK")
          PY
